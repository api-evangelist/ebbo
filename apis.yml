aid: ebbo
name: Ebbo
description: 'Ebbo is an enterprise loyalty and promotional marketing technology company that helps
  brands build lasting customer relationships and grow revenue through engagement. Its platform powers
  paid, tiered, and engagement-based loyalty programs alongside promotional overlays such as sweepstakes,
  instant wins, contests, and user-generated-content campaigns, supported by real-time performance
  dashboards, purchase validation, and advanced privacy and security controls. Ebbo pairs this technology
  with full-service program design, creative, program management, data analytics, rewards sourcing, and
  customer service for brands including T-Mobile, Lowe''s, and FULLBEAUTY Brands. Backed by Norwest
  Venture Partners.'
